<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#EDE7DA" id="kaya_theme_color" />
    <title>Kaya — Baduk</title>
    <meta name="description" content="A calm board for Baduk (Go / Weiqi). Play a friend or the computer. No account, no ads — it just opens and plays. Runs offline in your browser." />
    <meta property="og:title" content="Kaya — Baduk" />
    <meta property="og:description" content="A calm board for Baduk (Go / Weiqi). Play a friend or the computer, right in your browser. No account, no ads." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='9' fill='%23141210'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%23f4efe4' stroke='%23c3baa6'/%3E%3C/svg%3E" />
    <script>
        // Match the remembered theme immediately, so there's no light→dark flash.
        try { if (localStorage.getItem('kaya_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <style>
        :root {
            --bg: #EDE7DA; --accent: #2E6152; --track: #DBD3C4; --sub: #9C8F79;
        }
        :root.dark {
            --bg: #080B0E; --accent: #00E5FF; --track: #1B2026; --sub: #5D6B73;
        }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: var(--bg); color: var(--accent);
            font-family: system-ui, sans-serif;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }

        #kaya_loading {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg);
            transition: opacity 0.55s ease;
        }
        #kaya_loading.done { opacity: 0; pointer-events: none; }

        .kaya-mark {
            width: 92px; height: 92px;
            animation: kaya-breathe 2.1s ease-in-out infinite;
            transform-origin: center;
        }
        @keyframes kaya-breathe {
            0%, 100% { transform: scale(0.93); opacity: 0.92; }
            50%      { transform: scale(1.0);  opacity: 1; }
        }

        .kaya-word {
            margin-top: 22px;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 30px; letter-spacing: 0.04em; color: var(--accent);
        }

        .kaya-bar {
            margin-top: 20px; width: 168px; height: 4px;
            background: var(--track); border-radius: 4px; overflow: hidden;
        }
        .kaya-bar-fill {
            height: 100%; width: 0%;
            background: var(--accent); border-radius: 4px;
            transition: width 0.3s ease;
        }
        @media (prefers-reduced-motion: reduce) {
            .kaya-mark { animation: none; }
        }
    </style>
</head>
<body>
    <div id="kaya_loading">
        <svg class="kaya-mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Kaya">
            <defs>
                <radialGradient id="kg_black" cx="38%" cy="34%" r="72%">
                    <stop offset="0%" stop-color="#3a352c"/>
                    <stop offset="42%" stop-color="#1d1914"/>
                    <stop offset="100%" stop-color="#0d0b09"/>
                </radialGradient>
                <radialGradient id="kg_white" cx="38%" cy="34%" r="75%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="55%" stop-color="#f6f1e7"/>
                    <stop offset="100%" stop-color="#e2dac9"/>
                </radialGradient>
            </defs>
            <!-- soft contact shadows -->
            <ellipse cx="46" cy="64" rx="30" ry="30" fill="#000" opacity="0.14"/>
            <ellipse cx="74" cy="60" rx="30" ry="30" fill="#000" opacity="0.10"/>
            <!-- black stone -->
            <circle cx="44" cy="60" r="29" fill="url(#kg_black)"/>
            <circle cx="35" cy="50" r="6.5" fill="#cfd6d6" opacity="0.5"/>
            <circle cx="33.5" cy="48.5" r="2.6" fill="#eef1f2" opacity="0.85"/>
            <!-- white stone (overlaps in front) -->
            <circle cx="74" cy="58" r="29" fill="url(#kg_white)" stroke="#c3baa6" stroke-width="1"/>
            <circle cx="65" cy="48" r="6.5" fill="#ffffff" opacity="0.9"/>
        </svg>
        <div class="kaya-word">Kaya</div>
        <div class="kaya-bar"><div class="kaya-bar-fill" id="kaya_bar_fill"></div></div>
    </div>
    <canvas id="kaya_canvas"></canvas>

    <script type="module">
        import init from './kaya.js';

        const loading = document.getElementById('kaya_loading');
        const fill = document.getElementById('kaya_bar_fill');
        // The uncompressed wasm size (fetch streams give decompressed bytes even
        // when the server gzips, so this stays accurate). Rough is fine.
        const ASSUMED_BYTES = 3800000;

        function setPct(p) { fill.style.width = Math.round(Math.max(0, Math.min(p, 1)) * 100) + '%'; }
        function finish() {
            setPct(1);
            loading.classList.add('done');
            setTimeout(() => loading.remove(), 600);
        }

        async function boot() {
            try {
                // Stream the wasm ourselves so we can show download progress.
                const resp = await fetch('./kaya_bg.wasm');
                if (!resp.ok || !resp.body) throw new Error('fetch');
                const reader = resp.body.getReader();
                let received = 0;
                const chunks = [];
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    setPct((received / ASSUMED_BYTES) * 0.94); // leave headroom for compile
                }
                const bytes = new Uint8Array(received);
                let pos = 0;
                for (const c of chunks) { bytes.set(c, pos); pos += c.length; }
                await init(bytes);
                finish();
            } catch (e) {
                // Fallback: let wasm-bindgen fetch it the normal way.
                try { await init(); finish(); }
                catch (e2) {
                    console.error(e2);
                    document.querySelector('.kaya-word').textContent = 'Kaya failed to load';
                }
            }
        }
        boot();
    </script>
</body>
</html>
