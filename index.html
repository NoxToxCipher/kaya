<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#EDE7DA" />
    <title>Kaya — Baduk</title>
    <meta name="description" content="A calm board for Baduk (Go / Weiqi). Play a friend or the computer. No account, no ads — it just opens and plays. Runs offline in your browser." />
    <meta property="og:title" content="Kaya — Baduk" />
    <meta property="og:description" content="A calm board for Baduk (Go / Weiqi). Play a friend or the computer, right in your browser. No account, no ads." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='9' fill='%23141210'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%23f4efe4' stroke='%23c3baa6'/%3E%3C/svg%3E" />
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #EDE7DA; color: #2E6152;
            font-family: system-ui, sans-serif;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
        #kaya_loading {
            position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; font-size: 1.1rem; letter-spacing: 0.04em; opacity: 0.65;
        }
    </style>
</head>
<body>
    <div id="kaya_loading">Kaya…</div>
    <canvas id="kaya_canvas"></canvas>
    <script type="module">
        import init from './kaya.js';
        init().then(() => {
            const t = setInterval(() => {
                const c = document.getElementById('kaya_canvas');
                const l = document.getElementById('kaya_loading');
                if (c && c.width > 0) { if (l) l.remove(); clearInterval(t); }
            }, 120);
        }).catch(err => {
            const l = document.getElementById('kaya_loading');
            if (l) l.textContent = 'Kaya failed to load: ' + err;
            console.error(err);
        });
    </script>
</body>
</html>
